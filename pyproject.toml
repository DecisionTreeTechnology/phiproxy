[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "phiproxy"
dynamic = ["version"]
description = "Your patients' stand-in on the way to any LLM, and back: reversible PHI masking proxy (LiteLLM guardrail + Python library)."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
requires-python = ">=3.10"
authors = [{ name = "Decision Tree Technology" }]
keywords = ["phi", "pii", "hipaa", "phipa", "llm", "privacy", "de-identification", "litellm", "guardrail"]
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "Intended Audience :: Developers",
  "Intended Audience :: Healthcare Industry",
  "Programming Language :: Python :: 3",
  "Topic :: Security",
  "Topic :: Scientific/Engineering :: Medical Science Apps.",
]
dependencies = []

[project.optional-dependencies]
litellm = ["litellm>=1.70"]
redis = ["redis>=5"]
presidio = ["presidio-analyzer>=2.2"]
dev = ["pytest>=8", "pytest-asyncio>=0.23"]

[project.urls]
Homepage = "https://github.com/DecisionTreeTechnology/phiproxy"
Issues = "https://github.com/DecisionTreeTechnology/phiproxy/issues"

[tool.hatch.version]
path = "src/phiproxy/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/phiproxy"]

[tool.pytest.ini_options]
testpaths = ["tests", "src"]
addopts = "--doctest-modules --ignore=src/phiproxy/integrations"
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
filterwarnings = ["ignore::UserWarning:pydantic.*"]
