name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.10", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: pip install -e ".[dev,litellm]"
      - run: pytest -q
      - name: Benchmark (regex+known must stay at or above 96% recall)
        run: python benchmark/score.py --config regex+known --min-recall 0.96
      - name: Blind benchmark v1 (regex+known must stay at or above 87% recall)
        run: python benchmark/score.py --data benchmark/data/patient_comms_blind_v1.jsonl --config regex+known --min-recall 0.87
      - name: Blind benchmark v2 (regex+known must stay at or above 92% recall)
        run: python benchmark/score.py --data benchmark/data/patient_comms_blind_v2.jsonl --config regex+known --min-recall 0.92
      - name: Blind benchmark v3 (regex+known must stay at or above 76% recall)
        run: python benchmark/score.py --data benchmark/data/patient_comms_blind_v3.jsonl --config regex+known --min-recall 0.76
      - name: Blind benchmark v4 (regex+known must stay at or above 81% recall)
        run: python benchmark/score.py --data benchmark/data/patient_comms_blind_v4.jsonl --config regex+known --min-recall 0.81

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[litellm]" "litellm[proxy]"
      - name: Through a real LiteLLM proxy
        run: python examples/e2e/run_e2e.py
