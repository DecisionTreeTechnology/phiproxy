# Example gateway config. Replace the model list with your providers.
# Only route PHI to providers you have a BAA / data-processing agreement with:
# phiveil reduces what they see, it does not replace that agreement.
model_list:
  - model_name: gpt-4o
    litellm_params:
      model: azure/your-deployment-name
      api_base: os.environ/AZURE_API_BASE
      api_key: os.environ/AZURE_API_KEY
  - model_name: claude
    litellm_params:
      model: anthropic/claude-sonnet-5-5
      api_key: os.environ/ANTHROPIC_API_KEY

guardrails:
  - guardrail_name: phiveil
    litellm_params:
      guardrail: phiveil.integrations.litellm.PhiveilGuardrail
      mode: [pre_call, post_call]
      default_on: true
      redis_url: os.environ/PHIVEIL_REDIS_URL   # shared vault across replicas
      date_mode: token                          # "shift" keeps intervals, hides real dates
      # known_entities_provider: "yourapp.phi:lookup"   # async (session_id, metadata) -> dict

litellm_settings:
  # LiteLLM's own logs would otherwise hold the unmasked reply.
  turn_off_message_logging: true

general_settings:
  master_key: os.environ/LITELLM_MASTER_KEY
